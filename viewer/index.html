<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Bonsai BIM Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Search bar -->
      <header class="search-bar" data-search-bar>
        <div class="search-bar__inner">
          <svg class="search-bar__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" class="search-bar__input" placeholder="Search elements, storeys, types..." data-search-input autocomplete="off">
          <kbd class="search-bar__kbd">/</kbd>
        </div>
        <div class="search-results is-hidden" data-search-results></div>
      </header>

      <!-- 3D viewport -->
      <div class="viewport-container" data-viewport></div>

      <!-- Toolbar overlay -->
      <div class="toolbar" data-toolbar>
        <button class="toolbar__btn" data-tool="select" title="Select (V)" aria-label="Select tool">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
        </button>
        <button class="toolbar__btn" data-tool="section" title="Section plane (X)" aria-label="Section plane">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
        </button>
        <button class="toolbar__btn" data-tool="fit" title="Fit all (F)" aria-label="Fit all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
        <div class="toolbar__sep"></div>
        <button class="toolbar__btn" data-tool="wireframe" title="Wireframe (W)" aria-label="Toggle wireframe">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>

      <!-- Inspector panel (right side) -->
      <aside class="inspector-panel" data-inspector-panel>
        <div class="inspector-panel__header" data-inspector-header>
          <div class="inspector-panel__node-info">
            <span class="type-badge" data-inspector-type></span>
            <h2 data-inspector-title>No element selected</h2>
            <span class="inspector-panel__storey" data-inspector-storey></span>
          </div>
          <button class="inspector-panel__close" data-inspector-close aria-label="Close inspector">&times;</button>
        </div>
        <nav class="inspector-panel__tabs" data-inspector-tabs>
          <button class="tab-btn is-active" data-tab="properties">Properties</button>
          <button class="tab-btn" data-tab="geometry">Geometry</button>
          <button class="tab-btn" data-tab="relations">Relations</button>
        </nav>
        <div class="inspector-panel__body" data-inspector-body></div>
      </aside>

      <!-- Chat toggle button -->
      <button class="chat-toggle" data-chat-toggle aria-label="Open BIM chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>

      <!-- Chat panel -->
      <div class="chat-panel" data-chat-panel>
        <div class="chat-panel__header">
          <div class="chat-panel__title">
            <span class="chat-panel__dot" data-chat-dot></span>
            Ask BIM Operator
          </div>
          <button class="chat-panel__close" data-chat-close aria-label="Close chat">&times;</button>
        </div>
        <div class="chat-panel__messages" data-chat-messages></div>
        <div class="chat-panel__typing is-hidden" data-chat-typing>
          <div class="typing-indicator">
            <span class="typing-phase" data-typing-phase>Thinking</span>
            <span class="typing-dots"><span></span><span></span><span></span></span>
          </div>
        </div>
        <form class="chat-panel__form" data-chat-form>
          <textarea class="chat-panel__input" data-chat-input placeholder="Ask about the model, an element, or a design question..." rows="1"></textarea>
          <button type="submit" class="chat-panel__send" data-chat-send aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>

      <!-- Status bar -->
      <div class="status-bar" data-status-bar>
        <span class="status-bar__dot"></span>
        <span data-status-text>Loading model...</span>
      </div>

      <!-- Loading overlay -->
      <div class="loading-overlay" data-loading>
        <div class="loading-overlay__inner">
          <div class="loading-spinner"></div>
          <p class="loading-text" data-loading-text>Loading IFC model...</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
